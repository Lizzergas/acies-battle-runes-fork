# Include inside nginx's http block. Replace acies.example.com in both fragments.
limit_conn_zone $binary_remote_addr zone=acies_http_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name acies.example.com;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://acies.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name acies.example.com;
    ssl_certificate /etc/letsencrypt/live/acies.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acies.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_conn acies_http_connections 32;

    location = /community/metrics { return 404; }
    location /downloads/ {
        alias /srv/acies/downloads/;
        autoindex off;
    }

    location / {
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Acies-Client-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:8080;
    }
}
