# Include inside a top-level nginx stream block.
limit_conn_zone $binary_remote_addr zone=acies_gateway_connections:10m;

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    ssl_certificate /etc/letsencrypt/live/acies.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acies.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_handshake_timeout 8s;
    limit_conn acies_gateway_connections 16;
    proxy_connect_timeout 3s;
    proxy_timeout 100s;
    proxy_pass 127.0.0.1:9090;
}
